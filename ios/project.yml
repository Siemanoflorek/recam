name: RealCam
options:
  bundleIdPrefix: com.realcam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  RealCam:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        # Użyj NASZEGO Info.plist (z uprawnieniami), nie generowanego przez XcodeGen
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.realcam.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        # Budujemy bez podpisu – podpisze AltStore.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
